{% extends "base.html" %}

{% block title %}Profile - CyberSec{% endblock %}
{% block page_title %}User Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="cyber-card animate-fade-in">
            <div class="card-header text-center">
                <div class="mx-auto mb-3" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff;">
                    {{ user.username[0].upper() }}
                </div>
                <h5 class="mb-1">{{ user.username }}</h5>
                <span class="badge badge-info">{{ user.role.title() }}</span>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">Username</label>
                    <input type="text" class="form-control form-control-cyber" value="{{ user.username }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">Role</label>
                    <input type="text" class="form-control form-control-cyber" value="{{ user.role.title() }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">Account Created</label>
                    <input type="text" class="form-control form-control-cyber" value="{{ user.created_at.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
                </div>
                <hr style="border-color: var(--border-color);">
                <h6 class="mb-3"><i class="bi bi-key-fill me-2 text-warning"></i>Change Password</h6>
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">Current Password</label>
                    <input type="password" class="form-control form-control-cyber" placeholder="Enter current password">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">New Password</label>
                    <input type="password" class="form-control form-control-cyber" placeholder="Enter new password">
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: var(--text-muted);">Confirm New Password</label>
                    <input type="password" class="form-control form-control-cyber" placeholder="Confirm new password">
                </div>
                <button class="btn btn-cyber w-100"><i class="bi bi-shield-check me-2"></i>Update Password</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
